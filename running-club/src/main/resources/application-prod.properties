# ── DB (Supabase PostgreSQL) ────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── 파일 저장 (Oracle VM 로컬 — 영구 스토리지) ───────────────
file.upload.dir=/opt/nd-running/photos

# ── CORS ────────────────────────────────────────────────────
cors.allowed.origin=${CORS_ALLOWED_ORIGIN}

# ── H2 콘솔 비활성화 (운영 환경) ────────────────────────────
spring.h2.console.enabled=false

# ── 서버 도메인 (사진 URL 절대 경로용) ──────────────────────
server.base-url=https://nd-running-club.duckdns.org

# ── 세션 쿠키 (Vercel ↔ Oracle VM 크로스 도메인) ────────────
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# ── 기타 ────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=prometheus,health,info
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
