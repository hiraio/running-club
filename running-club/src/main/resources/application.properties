# 1. H2 로컬 DB 설정 (메모리가 아닌 파일 저장 방식 - 컴퓨터 꺼도 데이터 유지됨)
spring.datasource.url=jdbc:h2:file:~/runningdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. H2 콘솔 사용 설정 (브라우저에서 DB를 확인하기 위함)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 3. JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 모든 모니터링 엔드포인트를 노출 (프로메테우스 포함)
management.endpoints.web.exposure.include=prometheus,health,info
# 메트릭 데이터에 애플리케이션 이름 태그 달기
management.metrics.tags.application=running-club