spring.application.name=running-club

# ── H2 로컬 DB (파일 저장 — 재시작 후 데이터 유지) ──────────
spring.datasource.url=jdbc:h2:file:~/runningdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 콘솔 (개발용) ─────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ── JPA ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── 로깅 레벨 ─────────────────────────────────────────────────
# SQL 보려면 org.hibernate.SQL=DEBUG 로 임시 변경
logging.level.com.running.club=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN

# ── 모니터링 ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.tags.application=running-club

# ── 파일 업로드 ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=C:/running-photos

# ── Jackson: 날짜를 ISO 문자열로 직렬화 ──────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

